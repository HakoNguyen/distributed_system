# =====================================================================
# MỘT CHI NHÁNH (máy A chạy CN1, máy B chạy CN2)
#   docker compose -p minigo-cn1 --env-file cn1.env up -d --build
#   docker compose -p minigo-cn2 --env-file cn2.env up -d --build
# Cùng một file này, khác nhau duy nhất ở file .env.
# =====================================================================
services:

  # CSDL của riêng chi nhánh này. Chỉ chứa mảnh dữ liệu của nó.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: kho
    volumes:
      - ../shared/products.sql:/docker-entrypoint-initdb.d/01-products.sql:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "kho"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Dịch vụ quầy: bán, nhập, xem tồn + màn hình POS. Gửi heartbeat lên trung tâm.
  api:
    build: ./app
    environment:
      BRANCH_ID: ${BRANCH_ID:?Chưa đặt BRANCH_ID}
      BRANCH_NAME: ${BRANCH_NAME}
      DATABASE_URL: postgresql://app:app@db:5432/kho
      REPLICA_URLS: ${REPLICA_URLS:?Chưa đặt REPLICA_URLS}
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Tiến trình riêng: đẩy outbox lên Redpanda ở trung tâm, qua mạng thật.
  relay:
    build: ./app
    command: ["python", "relay.py"]
    environment:
      BRANCH_ID: ${BRANCH_ID}
      DATABASE_URL: postgresql://app:app@db:5432/kho
      KAFKA_BROKERS: ${HQ_HOST}:19092
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

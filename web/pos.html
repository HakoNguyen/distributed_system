<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniGo · Quầy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  :root {
    --paper: #F4F5F7; --card: #fff; --ink: #18212A; --muted: #66727D; --rule: #E3E7EA;
    --alert: #C8312A; --alert-bg: #FCEEED; --pending: #A86A00; --pending-bg: #FFF5E0; --ok: #0E7C66; --ok-bg: #E4F4EF;
    --c: #0E7C66;   /* màu chi nhánh, JS đổi theo BRANCH_ID */
    --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--font); font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }

  /* ---------- Đầu trang ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
           background: var(--card); border-bottom: 1px solid var(--rule); border-top: 4px solid var(--c); padding: .7rem 1.5rem; }
  .who { display: flex; align-items: baseline; gap: .7rem; }
  header h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
  header .role { color: var(--muted); }
  #links { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; font-size: .85rem; }
  #links::before { content: "Kết nối tới trung tâm"; color: var(--muted); margin-right: .2rem; }
  #links span { display: inline-flex; align-items: center; gap: .35rem; border: 1px solid var(--rule); border-radius: 999px;
                padding: .15rem .65rem; color: var(--ink); background: var(--card); }
  #links span::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--ok); }
  #links span.down::before { background: var(--alert); }
  #links span b { color: var(--ink); font-weight: 600; }
  #links span.down { border-color: var(--alert); color: var(--alert); }
  #links span.down b { color: var(--alert); }
  #link { padding: .5rem 1.5rem; font-size: .9rem; background: var(--ok-bg); color: var(--ok); font-weight: 500; }
  #link.busy { background: var(--pending-bg); color: var(--pending); }
  #link.down { background: var(--alert-bg); color: var(--alert); }
  #link b { font-weight: 700; }
  /* Vòng 6: lượt ghi hộ bị từ chối, phục hồi chưa gom đủ */
  #link .al { padding: .15rem 0 .15rem .7rem; border-left: 3px solid var(--alert); color: var(--alert); overflow-wrap: anywhere; }
  #link .al + .al { margin-top: .3rem; }
  #link .al.warn { border-left-color: var(--pending); color: var(--pending); }
  #link .al small { font-weight: 400; opacity: .85; white-space: nowrap; }
  #link .ack { margin-left: .3rem; font: inherit; font-size: .8rem; padding: .05rem .5rem; border: 1px solid currentColor; border-radius: 6px; background: var(--card); color: inherit; cursor: pointer; }

  /* ---------- Bố cục: danh mục | phiếu ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 1.2rem; padding: 1.2rem 1.5rem 2rem; align-items: start; }
  .panel { background: var(--card); border-radius: 12px; border: 1px solid var(--rule); }

  .toolbar { display: flex; gap: .8rem; padding: .9rem 1rem; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--paper); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: .45rem 1rem; border-radius: 7px; font-weight: 600; color: var(--muted); }
  .seg button[aria-checked="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .seg button:disabled { cursor: not-allowed; opacity: .6; }
  #search { flex: 1; min-width: 220px; font: inherit; padding: .5rem .8rem; border: 1px solid var(--rule); border-radius: 9px; background: #fff; }

  .products { max-height: calc(100vh - 13rem); overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: #FAFBFC; text-align: left; font-size: .78rem; font-weight: 600; color: var(--muted);
       text-transform: uppercase; letter-spacing: .04em; padding: .55rem 1rem; border-bottom: 1px solid var(--rule); }
  td { padding: .55rem 1rem; border-bottom: 1px solid var(--rule); }
  tr:last-child td { border-bottom: 0; }
  th.num, td.num { text-align: right; }
  td.code { color: var(--muted); width: 3.5rem; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #F7F9FA; }
  td .unit { color: var(--muted); font-size: .85rem; margin-left: .2rem; }
  td.low { color: var(--alert); font-weight: 600; }
  td.low small { display: block; font-weight: 400; font-size: .75rem; }
  td.act { width: 1%; }
  .add { border: 1px solid var(--rule); background: #fff; border-radius: 7px; padding: .2rem .7rem; font-weight: 600; color: var(--c); white-space: nowrap; }
  .add:hover { border-color: var(--c); }
  .none { padding: 1.5rem 1rem; color: var(--muted); text-align: center; }

  /* ---------- Phiếu ---------- */
  .ticket { position: sticky; top: 1rem; display: flex; flex-direction: column; }
  .ticket h2 { margin: 0; padding: .9rem 1rem; font-size: 1.05rem; border-bottom: 1px solid var(--rule); }
  #lines { list-style: none; margin: 0; padding: 0; max-height: calc(100vh - 22rem); overflow-y: auto; }
  #lines li { padding: .65rem 1rem; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto auto; gap: .3rem .6rem; align-items: center; }
  #lines .name { font-weight: 600; line-height: 1.3; }
  #lines .name small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
  .qty { display: inline-flex; align-items: center; border: 1px solid var(--rule); border-radius: 8px; }
  .qty button { border: 0; background: transparent; width: 1.9rem; height: 1.9rem; font-weight: 700; color: var(--muted); }
  .qty input { width: 3.4rem; border: 0; text-align: center; font: inherit; font-weight: 600; padding: 0; }
  .qty input:invalid { color: var(--alert); }
  .rm { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; width: 1.8rem; height: 1.8rem; border-radius: 6px; }
  .rm:hover { background: var(--alert-bg); color: var(--alert); }
  #lines .msg { grid-column: 1 / 4; font-size: .82rem; }
  #lines .msg.err { color: var(--alert); }
  #lines .msg.warn { color: var(--pending); }
  .empty-ticket { padding: 2rem 1rem; text-align: center; color: var(--muted); }
  .ticket-foot { padding: .9rem 1rem; display: grid; gap: .6rem; }
  #summary { color: var(--muted); }
  #summary b { color: var(--ink); }
  .actions { display: grid; grid-template-columns: 1fr auto; gap: .5rem; }
  #submit { border: 0; border-radius: 9px; padding: .75rem; font-weight: 700; font-size: 1rem; background: var(--c); color: #fff; }
  #submit:disabled { opacity: .45; cursor: not-allowed; }
  #clear { border: 1px solid var(--rule); background: #fff; border-radius: 9px; padding: .75rem 1rem; font-weight: 600; color: var(--muted); }
  #toast { min-height: 1.2rem; font-size: .9rem; color: var(--ok); }
  #toast.err { color: var(--alert); }
  .demo { border-top: 1px dashed var(--rule); padding: .7rem 1rem; font-size: .85rem; color: var(--muted); }
  .demo summary { cursor: pointer; }
  #bulk { margin-top: .5rem; border: 1px solid var(--rule); background: #fff; border-radius: 8px; padding: .4rem .8rem; font-weight: 600; color: var(--ink); }
  #selftest { display: none; margin: .5rem 1rem; padding: .4rem .7rem; border-radius: 8px; font-size: .85rem; font-weight: 600; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; padding: 1rem; }
    .ticket { position: static; }
    .products, #lines { max-height: none; }
    header, #link { padding-left: 1rem; padding-right: 1rem; }
  }
</style>
</head>
<body>
<header>
  <div class="who"><h1 id="title">Đang tải…</h1><span class="role">Quầy</span></div>
  <div id="links" aria-label="Độ trễ tới các bản sao trung tâm"></div>
</header>
<div id="link" role="status">Đang kiểm tra kết nối tới trung tâm…</div>

<div class="layout">
  <section class="panel">
    <div class="toolbar">
      <div class="seg" role="radiogroup" aria-label="Loại phiếu">
        <button type="button" role="radio" data-mode="sale" aria-checked="true">Bán hàng</button>
        <button type="button" role="radio" data-mode="receipt" aria-checked="false">Nhập hàng</button>
      </div>
      <input id="search" type="search" autocomplete="off" placeholder="Quét hoặc gõ mã / tên hàng, Enter để thêm vào phiếu"
             aria-label="Tìm mặt hàng">
    </div>
    <div class="products">
      <table>
        <thead><tr><th>Mã</th><th>Mặt hàng</th><th class="num">Tồn</th><th></th></tr></thead>
        <tbody id="products"></tbody>
      </table>
    </div>
  </section>

  <aside class="panel ticket" aria-labelledby="ticket-title">
    <h2 id="ticket-title">Phiếu bán</h2>
    <ul id="lines"></ul>
    <div class="ticket-foot">
      <div id="summary"></div>
      <div class="actions">
        <button type="button" id="submit">Thanh toán</button>
        <button type="button" id="clear">Xoá phiếu</button>
      </div>
      <div id="toast" aria-live="polite"></div>
    </div>
    <details class="demo">
      <summary>Công cụ demo</summary>
      <button id="bulk" type="button">Bán 20 đơn ngẫu nhiên</button>
    </details>
    <div id="selftest" role="status"></div>
  </aside>
</div>

<script>
const COLORS = { 1: "#0E7C66", 2: "#2F4BB3", 3: "#A15C07" };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ms = (x) => String(Math.round(x * 10) / 10).replace(".", ",");

// Mã yêu cầu duy nhất cho mỗi dòng phiếu: gửi lại (mạng chập chờn) thì server vẫn chỉ trừ một lần (PT-08).
// crypto.randomUUID chỉ có trên localhost/https nên có dự phòng.
const newRequestId = () =>
  (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);

// ---------------------------------------------------------------------------
// Cổng vào (vòng 5): mở qua nginx dưới /cnX/ thì gọi API qua cổng đang dùng; cổng không trả lời (lỗi mạng, quá
// 4 giây) thì chuyển sang cổng kế tiếp trong GATEWAYS. Lượt bán lỗi mạng giữ request_id (settle), bấm Thanh toán
// lại thì gửi qua cổng mới mà không trừ hai lần (PT-08). Mở thẳng chi nhánh (:8001) thì như cũ. Hàm thuần: selftest.
// ---------------------------------------------------------------------------
const posPrefix = (path) => (path.match(/^\/cn\d+\//) || [""])[0];
const apiUrl = (gate, prefix, path) => (gate ? `${gate}${prefix}${path}` : path);
function gateList(origin, listed) {
  return [...new Set([origin, ...(listed || "").split(",").map((g) => g.trim().replace(/\/$/, "")).filter(Boolean)])];
}
// Cổng `failed` vừa lỗi: chỉ chuyển nếu nó vẫn là cổng đang dùng (i). Nhiều lời gọi tới cùng cổng chết hết giờ cùng
// lúc (làm mới mỗi 1,5 giây cộng lượt bán) thì chỉ lời gọi đầu tiên chuyển, không nhảy qua mọi cổng.
const nextGate = (gates, i, failed = i) => (failed === i ? (i + 1) % gates.length : i);
const PREFIX = posPrefix(location.pathname);
let gates = [location.origin], gi = 0;

// prefix khác PREFIX (vòng 6): gọi trung tâm qua cổng vào, "/" (kết luận đa số) hoặc "/replica/<X>/" (ghi hộ); chỉ dùng
// khi mở qua nginx nên luôn ghép URL đầy đủ của cổng.
async function call(path, opts = {}, prefix = PREFIX) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 4000);
  const at = gi;
  const url = prefix === PREFIX && at === 0 ? path : apiUrl(gates[at], prefix, path);
  try {
    return await fetch(url, { cache: "no-store", ...opts, signal: ctl.signal });
  } catch (e) {
    if (gates.length > 1) {
      if (at === gi) toast(`Cổng vào ${gates[at]} không trả lời, chuyển sang ${gates[nextGate(gates, gi)]}. ` +
                           "Dòng chưa chắc đã gửi giữ nguyên mã, bấm Thanh toán lại.", true);
      // Cổng có thể vẫn sống mà chi nhánh phía sau treo (đo ở K14): chỉ dò lỗi mới cảnh báo
      if (at === gi) { gateLost = gates[at]; probeGates(); }
      gi = nextGate(gates, gi, at);
      e.gateSwitched = true;
    }
    throw e;
  } finally { clearTimeout(t); }
}

async function post(url, body, prefix = PREFIX) {
  const r = await call(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined }, prefix);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(r.status), { status: r.status, data });
  return data;
}

let products = [];             // từ api/inventory
let mode = "sale";             // "sale" | "receipt"
let cart = [];                 // [{ product_id, qty, rid, uncertain, msg }]
const byId = (id) => products.find((p) => p.product_id === id);

function toast(msg, isErr = false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = isErr ? "err" : "";
}

// ---------------------------------------------------------------------------
// Ghi hộ (vòng 6, PT-14). Chi nhánh lỗi HANDOFF_AFTER_FAILS lần liên tiếp VÀ kết luận đa số (/replica/<X>/api/nodes, đúng bản sao sẽ ghi hộ) là OFFLINE thì
// bán qua MỘT bản sao (/replica/<X>/api/handoff, thứ tự /lb/replicas.json), giữ bản sao đó tới khi nó lỗi (mạng, 5xx)
// rồi mới sang bản sao kế tiếp, cùng request_id. Kết luận mới SUSPECT thì chờ: khoá Thanh toán, giữ phiếu. Chi nhánh
// trả lời lại (kể cả đang RECOVERING) thì thôi ghi hộ. Chỉ khi mở qua nginx (/cnX/). Hàm thuần: selftest.
// ---------------------------------------------------------------------------
const HANDOFF_AFTER_FAILS = 2;
function posMode(fails, verdict, recoveryState) {
  if (fails < HANDOFF_AFTER_FAILS) return recoveryState === "RECOVERING" ? "recovering" : "local";
  return verdict === "OFFLINE" ? "handoff" : "waiting";
}
const branchFromPrefix = (prefix) => Number((prefix.match(/^\/cn(\d+)\/$/) || [])[1]) || null;
let BRANCH = branchFromPrefix(PREFIX);   // /api/info không trả lời (chi nhánh chết) thì lấy số từ /cnX/
let fails = 0, verdict = null, recovery = null, central = null;   // central: GET /api/handoff của bản sao đang dùng
let replicas = ["A", "B", "C"], ri = 0;
const currentMode = () => posMode(fails, verdict, recovery?.state);
const replicaPrefix = () => `/replica/${replicas[ri]}/`;

function setTitle(id, name) {
  document.documentElement.style.setProperty("--c", COLORS[id] || "#18212A");
  document.getElementById("title").textContent = `CN${id}${name ? " " + name : ""}`;
  document.title = `MiniGo · Quầy CN${id}${name ? " " + name : ""}`;
}

// Chi nhánh không trả lời: hỏi kết luận đa số ở ĐÚNG bản sao sẽ ghi hộ (nó cũng tự kiểm lại kết luận này, 409
// branch_not_offline), rồi đọc tồn tạm tính, số lượt ghi hộ ở đó. Bản sao lỗi thì lần sau dùng bản sao kế tiếp.
async function refreshCentral() {
  try {
    const r = await call("api/nodes", {}, replicaPrefix());
    if (!r.ok) throw new Error(r.status);
    const me = (await r.json()).find((n) => n.branch_id === BRANCH);
    verdict = me?.verdict ?? null;
    if (me) setTitle(BRANCH, me.branch_name);
    if (verdict !== "OFFLINE") return;
    const h = await call(`api/handoff?branch_id=${BRANCH}`, {}, replicaPrefix());
    if (!h.ok) throw new Error(h.status);
    central = await h.json();
    showProducts(central.stock);
  } catch (e) {
    verdict = null; central = null;
    if (!e.gateSwitched) ri = nextGate(replicas, ri);
  }
}

async function postHandoff(l) {
  try {
    return await post("api/handoff", { branch_id: BRANCH, product_id: l.product_id, qty: l.qty, request_id: l.rid }, replicaPrefix());
  } catch (e) {
    if (!e.gateSwitched && (!e.status || e.status >= 500)) ri = nextGate(replicas, ri);   // giữ request_id, gửi lại sang bản sao kế tiếp
    throw e;
  }
}

// ---------------------------------------------------------------------------
// Cảnh báo P-01..P-10 (vòng 6b, docs/demo.md mục 5 "Danh mục cảnh báo"). Hàm thuần, kiểm bằng ?selftest=1.
// ctx: st (/api/status lần làm mới này; null khi chi nhánh không trả lời), recovery (lần biết cuối), mode (posMode),
// verdict, replica, central, gates { list, cur, down, lost }, acked (Set request_id đã bấm "Đã biết"), localError.
// seen: lúc trang thấy lần đầu cảnh báo không có mốc server (giữ giữa các lần gọi, quên khi cảnh báo hết).
// ---------------------------------------------------------------------------
const SEV = { warn: 1, bad: 2 };
const hostOf = (g) => g.replace(/^https?:\/\//, "");
function posAlerts(c, now, seen = {}) {
  const out = [], st = c.st, rc = c.recovery;
  const t = (ts) => (ts ? Date.parse(ts) : null);
  if (st) {
    const fail = st.relay?.failing_since;
    if (fail) out.push({ id: "relay", s: "bad", since: t(fail), text: `Gửi lên Redpanda: lỗi từ ${clock(fail)}. ` +
      `Quầy vẫn bán bình thường; ${st.outbox_backlog} sự kiện đang nằm chờ trong outbox và sẽ tự gửi khi có lại.` });
    else if (st.sync_stuck) out.push({ id: "outbox", s: "warn", since: now - st.oldest_unsent_s * 1000,
      text: `${st.outbox_backlog} sự kiện chưa gửi được lên trung tâm. Quầy vẫn bán bình thường; outbox sẽ tự gửi khi có mạng.` });
    (st.links || []).forEach((l) => { if (!l.ok) out.push({ id: `link:${l.name}`, s: "warn",
      since: l.seconds_since_ok == null ? null : now - l.seconds_since_ok * 1000, text: `Bản sao máy ${l.name} mất liên lạc (heartbeat không tới).` }); });
  }
  // Mở thẳng chi nhánh: không ghi hộ được, P-10 đã báo
  if (c.mode === "waiting" && !c.direct) out.push({ id: "waiting", s: "bad", since: null, text: `Không gọi được chi nhánh. Trung tâm: ` +
    `${c.verdict === "SUSPECT" ? "nghi ngờ, chưa đủ đa số" : c.verdict === "ONLINE" ? "vẫn thấy chi nhánh sống" : "chưa hỏi được"}. ` +
    "Chưa ghi hộ: giữ phiếu và chờ (đa số kết luận mất liên lạc sau khoảng 15 giây)." });
  if (c.mode === "handoff") out.push({ id: "handoff", s: "warn", since: null,
    text: `Chi nhánh mất liên lạc (đa số bản sao kết luận OFFLINE). Đang ghi hộ qua trung tâm (bản sao ${c.replica})` +
      (c.central?.counts ? `: ${c.central.counts.pending} lượt chờ chi nhánh áp lại` : "") + ". Tồn hiển thị là tồn tạm tính; chỉ bán, không nhập." });
  if (c.mode === "recovering") out.push({ id: "recovering", s: "warn", since: t(rc?.since),
    text: `Chi nhánh đang phục hồi: đã áp ${rc.applied} lượt ghi hộ, từ chối ${rc.rejected}, còn ${rc.pending} chờ. Chưa nhận bán mới.` });
  if (rc?.incomplete) out.push({ id: "incomplete", s: "warn", since: t(rc.since),
    text: `Phục hồi chưa đủ: chưa gom được ghi hộ từ bản sao ${(rc.unreachable || []).join(", ")}; lượt ở đó sẽ áp muộn khi gọi lại được.` });
  // P-08: không tự tắt theo thời gian, quầy phải xử lý với khách; tắt khi thu ngân bấm "Đã biết"
  const rej = (rc?.rejected_items || []).filter((r) => !c.acked?.has(r.request_id));
  if (rej.length) out.push({ id: "rejected", s: "bad", since: Math.min(...rej.map((r) => t(r.rejected_at))), rids: rej.map((r) => r.request_id),
    text: "Lượt ghi hộ bị TỪ CHỐI khi chi nhánh áp lại: " + rej.slice(0, 5).map((r) => `${byId(r.product_id)?.name || "mã " + r.product_id} ×${r.qty} ` +
      `(${r.reason === "insufficient_stock" ? `tồn thật chỉ còn ${r.qty_on_hand}` : "không có mã hàng"}, lúc ${clock(r.rejected_at)})`).join("; ") + "." });
  Object.entries(c.gates?.down || {}).forEach(([g, at]) => out.push({ id: `gate:${g}`, s: "warn", since: at, approx: true,
    text: `Cổng vào ${hostOf(g)} không trả lời` + (g === c.gates.lost ? `, đang dùng ${hostOf(c.gates.list[c.gates.cur])}` : "") + "." }));
  // P-11 (vòng 7, PT-12): primary không có standby streaming; sync thì lượt bán treo
  const db = st?.db;
  if (db?.role === "primary" && !db.standby?.connected) out.push(db.sync_mode === "sync"
    ? { id: "standby", s: "bad", since: null, text: "CSDL chi nhánh chạy đồng bộ mà không có standby: lượt bán đang treo. Chạy make sync-mode MODE=async." }
    : { id: "standby", s: "warn", since: null, text: "CSDL chi nhánh không có standby: mất primary lúc này là mất dữ liệu (quầy vẫn bán)." });
  if (c.localError) out.push({ id: "local", s: "bad", since: c.localError, approx: true,
    text: "Không đọc được dữ liệu của chính chi nhánh. Kiểm tra container api và db." });
  for (const a of out) {
    a.approx ??= a.since == null;
    if (a.since == null) a.since = seen[a.id] ??= now;
  }
  Object.keys(seen).forEach((k) => { if (!out.some((a) => a.id === k)) delete seen[k]; });
  return out.sort((a, b) => (SEV[b.s] - SEV[a.s]) || (a.since - b.since));
}

// "Đã biết" cho lượt ghi hộ bị từ chối, theo request_id; localStorage hỏng hoặc bị chặn thì chỉ nhớ tới khi tải lại
const ACKED = "minigo.rejectedAck";
function loadAcked(store) {
  try { const v = JSON.parse(store.getItem(ACKED)); return new Set(Array.isArray(v) ? v : []); } catch { return new Set(); }
}
function ackRejected(store, rids) {
  const s = loadAcked(store);
  rids.forEach((r) => s.add(r));
  try { store.setItem(ACKED, JSON.stringify([...s].slice(-200))); } catch { /* chỉ trong bộ nhớ */ }
  return s;
}

function renderAlerts(list, st) {
  const el = document.getElementById("link");
  if (!list.length) {
    const n = st?.outbox_backlog ?? 0;
    el.className = n ? "busy" : "";
    el.innerHTML = !st ? "Đang kiểm tra kết nối tới trung tâm…" : n ? `Đang gửi <b>${n}</b> sự kiện lên trung tâm.` : "Mọi lượt bán đã gửi lên trung tâm.";
    return;
  }
  el.className = list.some((a) => a.s === "bad") ? "down" : "busy";
  el.innerHTML = list.map((a) => `<div class="al ${a.s}">${esc(a.text)} <small>từ ${a.approx ? "~" : ""}${clock(a.since)}</small>` +
    (a.rids ? ` <button type="button" class="ack" data-ack="${esc(a.rids.join(","))}">Đã biết</button>` : "") + `</div>`).join("");
}
document.getElementById("link").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-ack]");
  if (!b) return;
  try { acked = ackRejected(localStorage, b.dataset.ack.split(",")); } catch { b.dataset.ack.split(",").forEach((r) => acked.add(r)); }
  showAlerts();
});

// ---------------------------------------------------------------------------
// Kết quả gửi một dòng phiếu. Hàm thuần, kiểm bằng ?selftest=1.
// - Thành công: dòng xong, bỏ khỏi phiếu.
// - Server trả lỗi (có mã HTTP): chưa trừ gì, bỏ request_id để lần sau là yêu cầu mới.
// - Lỗi mạng: KHÔNG biết server đã trừ chưa, giữ request_id và khoá số lượng; gửi lại thì server trả kết quả cũ
//   chứ không trừ hai lần.
// ---------------------------------------------------------------------------
// Server trả lời nhưng CHƯA xử lý, thử lại sau (vòng 6): giữ request_id như lỗi mạng, vì dòng có thể đã nằm ở nơi khác
// (đã gửi chi nhánh trước khi nó chết, hoặc đã ghi hộ ở bản sao cũ). 5xx: không biết đã ghi chưa (vòng 7: COMMIT có thể
// đã xong ở standby trước khi kết nối đứt), gửi lại cùng request_id thì server trả kết quả cũ.
const RETRY_LATER = ["branch_recovering", "branch_not_offline"];
function errorText(status, data) {
  const d = data?.detail;
  if (d?.error === "branch_recovering") return "Chi nhánh đang phục hồi (áp các lượt ghi hộ), chưa nhận bán mới. Thử lại sau vài giây.";
  if (d?.error === "branch_not_offline") return "Trung tâm chưa kết luận chi nhánh mất liên lạc nên chưa ghi hộ. Thử lại sau.";
  if (d?.error === "insufficient_stock") return `Không đủ hàng: chỉ còn ${d.qty_on_hand}.`;
  if (d?.error === "product_not_found") return "Không có mã hàng này.";
  if (d?.error === "version_conflict") return "Số tồn vừa bị quầy khác sửa, thử lại.";
  if (Array.isArray(d)) return "Số lượng phải là số nguyên từ 1 đến 1000.";
  return `Lỗi mã ${status}.`;
}
function settle(line, outcome) {
  if (outcome.ok) return { ...line, done: true, uncertain: false, msg: "" };
  if (RETRY_LATER.includes(outcome.data?.detail?.error)) return { ...line, msg: errorText(outcome.status, outcome.data) };
  // Mọi 5xx (vòng 7: 500, 503 db_unavailable lúc chuyển primary, 502–504 từ nginx): chưa rõ đã ghi chưa, giữ request_id
  if (outcome.status && outcome.status < 500)
    return { ...line, rid: null, uncertain: false, msg: errorText(outcome.status, outcome.data) };
  return { ...line, uncertain: true, msg: "Chưa rõ đã ghi chưa (mất kết nối). Bấm gửi lại: không bị trừ hai lần." };
}

// ---------------------------------------------------------------------------
// Danh mục hàng
// ---------------------------------------------------------------------------
function match(p, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return String(p.product_id) === q || p.name.toLowerCase().includes(q);
}

function renderProducts() {
  const q = document.getElementById("search").value.trim();
  const rows = products.filter((p) => match(p, q));
  document.getElementById("products").innerHTML = rows.length ? rows.map((p) => {
    const low = p.qty_on_hand < p.reorder_point;
    return `<tr data-id="${p.product_id}">
      <td class="code">${p.product_id}</td>
      <td>${esc(p.name)}</td>
      <td class="num ${low ? "low" : ""}">${p.qty_on_hand}<span class="unit">${esc(p.unit)}</span>${low ? `<small>dưới ngưỡng ${p.reorder_point}</small>` : ""}</td>
      <td class="act"><button type="button" class="add" data-id="${p.product_id}" aria-label="Thêm ${esc(p.name)} vào phiếu">+ Thêm</button></td>
    </tr>`;
  }).join("") : `<tr><td colspan="4" class="none">Không có mặt hàng khớp "${esc(q)}".</td></tr>`;
}

function addToCart(id) {
  if (!byId(id)) return;
  const line = cart.find((l) => l.product_id === id);
  if (line) {
    if (line.uncertain) return toast("Dòng này đang chờ gửi lại, chưa sửa số lượng được.", true);
    line.qty = Math.min(1000, line.qty + 1); line.rid = null; line.msg = "";
  } else cart.push({ product_id: id, qty: 1, rid: null, uncertain: false, msg: "" });
  renderCart();
}

document.getElementById("products").addEventListener("click", (ev) => {
  const tr = ev.target.closest("tr[data-id]");
  if (tr) addToCart(Number(tr.dataset.id));
});
// Máy quét mã vạch gõ mã rồi Enter: thêm đúng mã đó, không thì thêm mặt hàng đầu tiên khớp
document.getElementById("search").addEventListener("input", renderProducts);
document.getElementById("search").addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  const q = ev.target.value.trim();
  const p = products.find((x) => String(x.product_id) === q) || products.find((x) => match(x, q));
  if (p) { addToCart(p.product_id); ev.target.value = ""; renderProducts(); }
});

// ---------------------------------------------------------------------------
// Phiếu
// ---------------------------------------------------------------------------
function renderCart() {
  const sale = mode === "sale";
  document.getElementById("ticket-title").textContent = sale ? "Phiếu bán" : "Phiếu nhập";
  document.getElementById("submit").textContent = sale ? "Thanh toán" : "Nhập kho";
  const el = document.getElementById("lines");
  el.innerHTML = cart.length ? cart.map((l, i) => {
    const p = byId(l.product_id) || { name: `Mã ${l.product_id}`, unit: "", qty_on_hand: 0 };
    const over = sale && l.qty > p.qty_on_hand;
    const msg = l.msg ? `<div class="msg ${l.uncertain ? "warn" : "err"}">${esc(l.msg)}</div>`
              : over ? `<div class="msg warn">Tồn chỉ còn ${p.qty_on_hand} ${esc(p.unit)}.</div>` : "";
    return `<li>
      <div class="name">${esc(p.name)}<small>Mã ${l.product_id} · tồn ${p.qty_on_hand} ${esc(p.unit)}</small></div>
      <div class="qty">
        <button type="button" data-i="${i}" data-step="-1" aria-label="Bớt 1" ${l.uncertain ? "disabled" : ""}>−</button>
        <input type="number" min="1" max="1000" step="1" value="${l.qty}" data-i="${i}" aria-label="Số lượng ${esc(p.name)}" ${l.uncertain ? "disabled" : ""}>
        <button type="button" data-i="${i}" data-step="1" aria-label="Thêm 1" ${l.uncertain ? "disabled" : ""}>+</button>
      </div>
      <button type="button" class="rm" data-rm="${i}" aria-label="Bỏ ${esc(p.name)} khỏi phiếu">×</button>
      ${msg}
    </li>`;
  }).join("") : `<li class="empty-ticket">Phiếu trống. Chọn mặt hàng ở danh sách bên trái hoặc quét mã.</li>`;
  const units = cart.reduce((s, l) => s + l.qty, 0);
  document.getElementById("summary").innerHTML = cart.length ? `<b>${cart.length}</b> mặt hàng, <b>${units}</b> đơn vị` : "";
  // Vòng 6: chờ kết luận hoặc chi nhánh đang phục hồi thì chưa gửi được; ghi hộ chỉ có bán
  const m = currentMode();
  document.getElementById("submit").disabled = !cart.length || m === "waiting" || m === "recovering";
  document.getElementById("bulk").disabled = m !== "local";
  // Dòng chưa rõ kết quả gắn với loại phiếu đã gửi: không cho đổi loại phiếu tới khi gửi lại xong
  document.querySelectorAll(".seg button").forEach((b) => {
    b.setAttribute("aria-checked", b.dataset.mode === mode);
    b.disabled = (cart.some((l) => l.uncertain) && b.dataset.mode !== mode) || (m === "handoff" && b.dataset.mode === "receipt");
  });
}

const lines = document.getElementById("lines");
lines.addEventListener("click", (ev) => {
  const rm = ev.target.closest("[data-rm]");
  if (rm) { cart.splice(Number(rm.dataset.rm), 1); return renderCart(); }
  const b = ev.target.closest("button[data-step]");
  if (!b) return;
  const l = cart[Number(b.dataset.i)];
  l.qty = Math.max(1, Math.min(1000, l.qty + Number(b.dataset.step))); l.rid = null; l.msg = "";
  renderCart();
});
lines.addEventListener("change", (ev) => {
  const inp = ev.target.closest("input[data-i]");
  if (!inp) return;
  const l = cart[Number(inp.dataset.i)], v = Number(inp.value);
  if (!Number.isInteger(v) || v < 1 || v > 1000) { toast("Số lượng phải là số nguyên từ 1 đến 1000.", true); return renderCart(); }
  l.qty = v; l.rid = null; l.msg = "";
  renderCart();
});

document.querySelector(".seg").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-mode]");
  if (!b || b.disabled) return;
  mode = b.dataset.mode; toast(""); renderCart(); renderProducts();
});
document.getElementById("clear").addEventListener("click", () => { cart = cart.filter((l) => l.uncertain); toast(""); renderCart(); });

document.getElementById("submit").addEventListener("click", async (ev) => {
  const btn = ev.currentTarget; btn.disabled = true;
  const handoff = currentMode() === "handoff", via = replicas[ri];
  let done = 0, spent = 0;
  for (let i = 0; i < cart.length; i++) {
    const l = cart[i];
    l.rid ||= newRequestId();
    let outcome;
    try {
      const res = handoff ? await postHandoff(l) : await post(`api/${mode}`, { product_id: l.product_id, qty: l.qty, request_id: l.rid });
      outcome = { ok: true, res }; done++; spent += res.elapsed_ms ?? 0;
    } catch (e) {
      outcome = e.status ? { status: e.status, data: e.data } : { network: true };
    }
    cart[i] = settle(l, outcome);
  }
  cart = cart.filter((l) => !l.done);
  const verb = mode === "sale" ? "Đã bán" : "Đã nhập";
  if (done && handoff) toast(`Đã ghi hộ ${done} mặt hàng qua bản sao ${via}; chi nhánh sẽ áp khi phục hồi.` + (cart.length ? ` Còn ${cart.length} dòng lỗi.` : ""), !!cart.length);
  else if (done) toast(`${verb} ${done} mặt hàng. Xử lý tại chỗ trong ${ms(spent)} ms.` + (cart.length ? ` Còn ${cart.length} dòng lỗi.` : ""), !!cart.length);
  else toast("Chưa ghi được dòng nào, xem lỗi ở từng dòng.", true);
  renderCart(); refresh();
});

document.getElementById("bulk").addEventListener("click", async (ev) => {
  const btn = ev.currentTarget; btn.disabled = true;
  try {
    const r = await post("api/sale/random?count=20");
    toast(`Đã bán ${r.sold} đơn ngẫu nhiên${r.skipped_out_of_stock ? `, bỏ qua ${r.skipped_out_of_stock} đơn vì hết hàng` : ""}.`);
  } catch (e) { toast(e.data?.detail?.error ? errorText(e.status, e.data) : `Không bán được (mã lỗi ${e.status || e.message}).`, true); }
  renderCart(); refresh();   // renderCart mở lại nút theo chế độ hiện tại
});

// ---------------------------------------------------------------------------
// Trạng thái gửi lên trung tâm
// ---------------------------------------------------------------------------
const clock = (ts) => new Date(ts).toLocaleTimeString("vi-VN", { hour12: false });

// Dải #link do renderAlerts vẽ (vòng 6b); ở đây chỉ còn chip độ trễ tới từng bản sao, đo bằng heartbeat
function renderLink(s) {
  document.getElementById("link").title = s.relay?.failing_since ? s.relay.last_error || "" : "";
  document.getElementById("links").innerHTML = s.links.map((l) => l.ok
    ? `<span>Bản sao máy ${esc(l.name)}: <b>${l.rtt_ms} ms</b></span>`
    : `<span class="down">Bản sao máy ${esc(l.name)}: <b>mất liên lạc</b></span>`).join("");
}

let lastRendered = "";  // chỉ vẽ lại danh mục khi số liệu đổi
function showProducts(inv) {
  const snapshot = JSON.stringify(inv);
  if (snapshot === lastRendered) return;
  products = inv; renderProducts(); lastRendered = snapshot;
  if (!lines.contains(document.activeElement)) renderCart();   // đang gõ số lượng thì không vẽ lại phiếu
}

let lastMode = "local";
let lastSt = null, localError = null;     // lastSt: /api/status lần làm mới gần nhất mà chi nhánh trả lời
let acked = (() => { try { return loadAcked(localStorage); } catch { return new Set(); } })();
const seenAlerts = {}, gateDown = {};
let gateLost = null;
function showAlerts() {
  const now = Date.now();
  renderAlerts(posAlerts({ st: fails ? null : lastSt, recovery, mode: currentMode(), direct: !PREFIX, verdict, replica: replicas[ri], central,
    gates: { list: gates, cur: gi, down: gateDown, lost: gateLost }, acked, localError }, now, seenAlerts), fails ? null : lastSt);
}
async function refresh() {
  try {
    const [invR, stR] = await Promise.all([call("api/inventory"), call("api/status")]);
    // 502–504 (nginx: chi nhánh không trả lời) cũng là lỗi của chi nhánh
    if (!invR.ok || !stR.ok) throw new Error(`chi nhánh trả ${invR.ok ? stR.status : invR.status}`);
    const [inv, st] = [await invR.json(), await stR.json()];
    fails = 0; recovery = st.recovery; central = null; lastSt = st; localError = null;
    showProducts(inv);
    renderLink(st);
  } catch (e) {
    // call() vừa chuyển cổng thì đã tự báo và không tính là chi nhánh lỗi; lần làm mới sau đi cổng mới
    if (!e.gateSwitched) fails++;
    if (fails >= HANDOFF_AFTER_FAILS && PREFIX && BRANCH) await refreshCentral();
    else if (!PREFIX && !e.gateSwitched) localError ??= Date.now();
  }
  const m = currentMode();
  if (m === "handoff" && mode !== "sale" && !cart.some((l) => l.uncertain)) { mode = "sale"; renderProducts(); }   // ghi hộ chỉ có bán
  showAlerts();
  if (m !== lastMode) { lastMode = m; renderCart(); }
}

// P-09: dò mọi cổng vào (chỉ khi mở qua nginx); lỗi thì ghi lúc lỗi đầu, trả lời lại thì xoá
async function probeGates() {
  if (gates.length < 2) return;
  await Promise.all(gates.map(async (g) => {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 2000);
    try {
      const r = await fetch(`${g}/lb/gateways.json`, { cache: "no-store", signal: ctl.signal });
      if (!r.ok) throw new Error(r.status);
      delete gateDown[g];
    } catch { gateDown[g] ??= Date.now(); } finally { clearTimeout(tm); }
  }));
}

function selftest() {
  const r = [];
  const check = (name, ok) => { r.push([name, ok]); console.assert(ok, name); };
  const line = { product_id: 1, qty: 3, rid: "x", uncertain: false, msg: "" };
  check("thành công thì xong dòng", settle(line, { ok: true }).done === true);
  const net = settle(line, { network: true });
  check("lỗi mạng giữ request_id và khoá dòng", net.rid === "x" && net.uncertain);
  const stock = settle(net, { status: 422, data: { detail: { error: "insufficient_stock", qty_on_hand: 2 } } });
  check("server từ chối thì bỏ request_id, mở khoá", stock.rid === null && !stock.uncertain && stock.msg.includes("chỉ còn 2"));
  check("lỗi kiểm số lượng của StockChange", settle(line, { status: 422, data: { detail: [{}] } }).msg.includes("1 đến 1000"));
  check("tìm theo mã hoặc tên", match({ product_id: 7, name: "Gạo thơm" }, "7") && match({ product_id: 7, name: "Gạo thơm" }, "gạo") && !match({ product_id: 17, name: "Sữa" }, "7"));
  // Cổng vào (vòng 5): POS mở qua nginx dưới /cnX/ thì gọi API qua cổng đang dùng; mở thẳng thì đường tương đối như cũ
  check("tiền tố /cn2/ khi mở qua cổng vào, rỗng khi mở thẳng", posPrefix("/cn2/") === "/cn2/" && posPrefix("/") === "");
  check("ghép URL qua cổng vào", apiUrl("http://localhost:8012", "/cn2/", "api/sale") === "http://localhost:8012/cn2/api/sale" && apiUrl("", "", "api/sale") === "api/sale");
  check("cổng đang mở đứng đầu, bỏ trùng", gateList("http://localhost:8012", "http://localhost,http://localhost:8012").join() === "http://localhost:8012,http://localhost");
  check("cổng kế tiếp quay vòng", nextGate(["a", "b"], 1) === 0 && nextGate(["a"], 0) === 0);
  check("lỗi muộn của cổng cũ không làm nhảy thêm cổng", nextGate(["a", "b", "c"], 1, 0) === 1);
  // Vòng 6: ghi hộ
  check("chi nhánh trả lời: bán tại chỗ, hoặc đang phục hồi", posMode(0, null, "ONLINE") === "local" && posMode(0, "OFFLINE", "RECOVERING") === "recovering");
  check("lỗi 1 lần chưa đủ để ghi hộ", posMode(1, "OFFLINE", "ONLINE") === "local");
  check("lỗi 2 lần mà mới nghi ngờ hoặc không hỏi được: chờ", posMode(2, "SUSPECT") === "waiting" && posMode(2, null) === "waiting" && posMode(2, "ONLINE") === "waiting");
  check("lỗi 2 lần và đa số OFFLINE: ghi hộ", posMode(2, "OFFLINE") === "handoff" && posMode(5, "OFFLINE", "RECOVERING") === "handoff");
  check("số chi nhánh lấy từ /cnX/", branchFromPrefix("/cn2/") === 2 && branchFromPrefix("") === null);
  check("ghép URL ghi hộ qua cổng vào", apiUrl("http://localhost", "/replica/A/", "api/handoff") === "http://localhost/replica/A/api/handoff");
  const unsure = { ...line, rid: "y", uncertain: true };
  const rec = settle(unsure, { status: 503, data: { detail: { error: "branch_recovering", stale: false } } });
  check("chi nhánh đang phục hồi: giữ request_id và khoá dòng", rec.rid === "y" && rec.uncertain && rec.msg.includes("phục hồi"));
  check("chưa đủ đa số: giữ request_id", settle(line, { status: 409, data: { detail: { error: "branch_not_offline" } } }).rid === "x");
  check("502 từ nginx: chưa rõ đã tới chưa, giữ request_id", settle(line, { status: 502, data: {} }).rid === "x" && settle(line, { status: 502, data: {} }).uncertain);

  // Vòng 6b: cảnh báo P-01..P-10 (docs/demo.md mục 5, "Danh mục cảnh báo"). posAlerts(ctx, now, seen): danh sách đã
  // xếp { id, s, text, since (ms), approx }; seen giữ lúc trang thấy lần đầu của cảnh báo không có mốc server.
  // loadAcked/ackRejected: "Đã biết" cho lượt ghi hộ bị từ chối, lưu theo request_id. Hàm chưa có thì kiểm trượt kèm lỗi.
  const T = (name, fn) => { try { check(name, !!fn()); } catch (e) { r.push([name, false, e.message]); } };
  const now = Date.parse("2026-11-27T10:00:30Z"), iso = (s) => new Date(now - s * 1000).toISOString(), at = (s) => now - s * 1000;
  const rec0 = { state: "ONLINE", since: iso(100), pending: 0, applied: 0, rejected: 0, incomplete: false, unreachable: [], rejected_items: [] };
  const pst = (o = {}) => ({ outbox_backlog: 0, oldest_unsent_s: 0, sync_stuck: false, relay: { failing_since: null }, recovery: rec0,
                             links: [{ name: "A", ok: true, rtt_ms: 5, seconds_since_ok: 1 }, { name: "B", ok: true, rtt_ms: 3, seconds_since_ok: 1 }], ...o });
  const PG = ["http://localhost", "http://localhost:8012"];
  const pctx = (o = {}) => ({ st: pst(), recovery: rec0, mode: "local", verdict: null, replica: "A", central: null,
                              gates: { list: PG, cur: 0, down: {}, lost: null }, acked: new Set(), localError: null, ...o });
  const pone = (l, id) => l.filter((a) => a.id === id).length === 1 ? l.find((a) => a.id === id) : null;
  const rj = (rid, s) => ({ request_id: rid, product_id: 11, qty: 10, reason: "insufficient_stock", qty_on_hand: 2, rejected_at: iso(s) });

  T("bình thường: không cảnh báo", () => posAlerts(pctx(), now, {}).length === 0);
  T("P-01 relay lỗi: đỏ, mốc failing_since, gộp số sự kiện chờ", () => {
    const l = posAlerts(pctx({ st: pst({ relay: { failing_since: iso(10) }, outbox_backlog: 7, oldest_unsent_s: 12, sync_stuck: true }) }), now, {});
    const a = pone(l, "relay");
    return l.length === 1 && a && a.s === "bad" && a.since === at(10) && a.text.includes("7");
  });
  T("P-02 outbox tồn đọng, relay không báo lỗi: vàng, mốc sự kiện cũ nhất", () => {
    const a = pone(posAlerts(pctx({ st: pst({ outbox_backlog: 4, oldest_unsent_s: 12, sync_stuck: true }) }), now, {}), "outbox");
    return a && a.s === "warn" && a.since === at(12);
  });
  T("P-03 heartbeat tới bản sao B lỗi: vàng, mốc lần cuối gọi được", () => {
    const st = pst({ links: [{ name: "A", ok: true, rtt_ms: 5, seconds_since_ok: 1 }, { name: "B", ok: false, rtt_ms: null, seconds_since_ok: 9 }] });
    const a = pone(posAlerts(pctx({ st }), now, {}), "link:B");
    return a && a.s === "warn" && a.since === at(9) && a.text.includes("B");
  });
  T("P-04 chờ kết luận: đỏ, mốc trang thấy (~)", () => {
    const a = pone(posAlerts(pctx({ st: null, mode: "waiting", verdict: "SUSPECT" }), now, {}), "waiting");
    return a && a.s === "bad" && a.text.includes("nghi ngờ") && a.since === now && a.approx;
  });
  T("P-04 không hiện khi mở thẳng chi nhánh (P-10 thay, đo ở P-10)", () =>
    posAlerts(pctx({ st: null, mode: "waiting", direct: true, localError: at(4) }), now, {}).map((x) => x.id).join() === "local");
  T("P-05 đang ghi hộ: vàng, ghi bản sao", () => {
    const a = pone(posAlerts(pctx({ st: null, mode: "handoff", verdict: "OFFLINE", central: { counts: { pending: 2 } } }), now, {}), "handoff");
    return a && a.s === "warn" && a.text.includes("bản sao A");
  });
  T("P-06 đang phục hồi: vàng, mốc recovery.since", () => {
    const rc = { ...rec0, state: "RECOVERING", since: iso(3) };
    const a = pone(posAlerts(pctx({ st: pst({ recovery: rc }), recovery: rc, mode: "recovering" }), now, {}), "recovering");
    return a && a.s === "warn" && a.since === at(3);
  });
  T("P-07 phục hồi chưa đủ: vàng, ghi bản sao chưa gom được", () => {
    const rc = { ...rec0, incomplete: true, unreachable: ["C"], since: iso(70) };
    const a = pone(posAlerts(pctx({ st: pst({ recovery: rc }), recovery: rc }), now, {}), "incomplete");
    return a && a.s === "warn" && a.text.includes("C");
  });
  T("P-08 lượt ghi hộ bị từ chối: đỏ, không tự tắt theo thời gian", () => {
    const rc = { ...rec0, rejected: 1, rejected_items: [rj("r1", 3600)] };
    const a = pone(posAlerts(pctx({ recovery: rc, st: pst({ recovery: rc }) }), now, {}), "rejected");
    return a && a.s === "bad" && a.since === at(3600) && a.text.includes("tồn thật chỉ còn 2");
  });
  T("P-08 bấm Đã biết thì tắt; chỉ tắt đúng lượt đã biết", () => {
    const rc = { ...rec0, rejected: 2, rejected_items: [rj("r1", 60), rj("r2", 30)] };
    const none = posAlerts(pctx({ recovery: rc, acked: new Set(["r1", "r2"]) }), now, {});
    const left = pone(posAlerts(pctx({ recovery: rc, acked: new Set(["r1"]) }), now, {}), "rejected");
    return none.length === 0 && left && left.since === at(30) && left.rids.join() === "r2";
  });
  T("P-08 Đã biết lưu theo request_id, đọc lại được; localStorage hỏng thì không lỗi", () => {
    const mem = {}, store = { getItem: (k) => mem[k] ?? null, setItem: (k, v) => { mem[k] = v; } };
    ackRejected(store, ["r1"]); ackRejected(store, ["r2"]);
    const broken = { getItem: () => { throw new Error("chặn"); }, setItem: () => { throw new Error("chặn"); } };
    return loadAcked(store).has("r1") && loadAcked(store).has("r2") && loadAcked(broken).size === 0 && ackRejected(broken, ["r3"]).has("r3");
  });
  T("P-09 cổng vào localhost chết, đang dùng 8012: vàng", () => {
    const a = pone(posAlerts(pctx({ gates: { list: PG, cur: 1, down: { [PG[0]]: at(5) }, lost: PG[0] } }), now, {}), `gate:${PG[0]}`);
    return a && a.s === "warn" && a.text.includes("8012") && a.since === at(5);
  });
  T("P-10 mở thẳng mà không đọc được chính chi nhánh: đỏ", () => {
    const a = pone(posAlerts(pctx({ st: null, localError: at(4) }), now, {}), "local");
    return a && a.s === "bad" && a.since === at(4);
  });
  T("xếp: đỏ trước vàng, cùng mức thì cũ trước", () => {
    const st = pst({ relay: { failing_since: iso(10) }, links: [{ name: "A", ok: false, seconds_since_ok: 30 }, { name: "B", ok: false, seconds_since_ok: 40 }] });
    return posAlerts(pctx({ st }), now, {}).map((a) => a.id).join() === "relay,link:B,link:A";
  });
  // Vòng 7 (PT-08, PT-12): mọi 5xx đều "chưa rõ đã ghi chưa" (COMMIT đứt giữa chừng có thể đã ghi): giữ request_id
  T("500 từ chi nhánh: giữ request_id và khoá dòng", () => {
    const x = settle(line, { status: 500, data: {} });
    return x.rid === "x" && x.uncertain;
  });
  T("503 db_unavailable (đang chuyển primary): giữ request_id và khoá dòng", () => {
    const x = settle(line, { status: 503, data: { detail: { error: "db_unavailable" } } });
    return x.rid === "x" && x.uncertain;
  });
  T("4xx vẫn bỏ request_id (server đã từ chối, chưa ghi gì)", () => settle(line, { status: 404, data: { detail: { error: "product_not_found" } } }).rid === null);
  // P-11: status.db (vòng 7)
  const dbs = (mode, connected) => ({ role: "primary", sync_mode: mode, timeline: 1,
    standby: { connected, state: connected ? "streaming" : null, lag_bytes: connected ? 0 : null } });
  T("P-11 async không standby: vàng; sync không standby: đỏ, nhắc lượt bán treo", () => {
    const w = pone(posAlerts(pctx({ st: pst({ db: dbs("async", false) }) }), now, {}), "standby");
    const b = pone(posAlerts(pctx({ st: pst({ db: dbs("sync", false) }) }), now, {}), "standby");
    return w && w.s === "warn" && w.text.includes("standby") && b && b.s === "bad" && b.text.includes("treo");
  });
  T("P-11 standby đang streaming, hoặc chi nhánh cũ chưa có db: không cảnh báo", () =>
    posAlerts(pctx({ st: pst({ db: dbs("sync", true) }) }), now, {}).length === 0 && posAlerts(pctx(), now, {}).length === 0);
  T("mốc trang thấy giữ từ lần đầu, hết cảnh báo thì quên", () => {
    const seen = {}, c = pctx({ st: null, mode: "waiting" });
    posAlerts(c, now, seen);
    const again = pone(posAlerts(c, now + 6000, seen), "waiting");
    posAlerts(pctx(), now + 8000, seen);
    return again.since === now && !("waiting" in seen);
  });

  const failed = r.filter(([, ok]) => !ok);
  const el = document.getElementById("selftest");
  el.style.display = "block";
  el.style.background = failed.length ? "var(--alert-bg)" : "var(--ok-bg)";
  el.style.color = failed.length ? "var(--alert)" : "var(--ok)";
  el.textContent = `Selftest: ${r.length - failed.length}/${r.length} đạt` +
    (failed.length ? `. Trượt: ${failed.map(([n, , err]) => err ? `${n} (${err})` : n).join("; ")}` : "");
  console.log(el.textContent);
}
if (new URLSearchParams(location.search).get("selftest") === "1") selftest();

(async () => {
  // Danh sách cổng vào đọc một lần, chỉ khi mở qua nginx (/cnX/)
  if (PREFIX) try { gates = gateList(location.origin, await fetch("/lb/gateways.json").then((r) => r.json())); } catch { /* chỉ một cổng */ }
  if (PREFIX) try { replicas = await fetch("/lb/replicas.json").then((r) => r.json()); } catch { /* giữ A, B, C */ }
  try {
    const info = await fetch("api/info").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
    BRANCH = info.branch_id; setTitle(info.branch_id, info.branch_name);
  } catch {
    // Chi nhánh không trả lời (nginx trả trang này từ @pos_page): số chi nhánh lấy từ /cnX/, tên lấy từ /api/nodes sau
    if (BRANCH) setTitle(BRANCH, ""); else document.getElementById("title").textContent = "Không liên lạc được chi nhánh";
  }
  renderCart();
  refresh();
  setInterval(refresh, 1500);
  setInterval(probeGates, 10000);   // GATE_PROBE_S của dashboard
  document.getElementById("search").focus();
})();
</script>
